state_dir = "~/.local/state/dotagent"
concurrency = 1
min_free_gb = 10

[host]
codex_sandbox = "workspace-write"
claude_permission_mode = "acceptEdits"
iteration_seconds = 1800
stall_seconds = 600
# Optional explicit arguments use native host permissions. Never copy login tokens.
codex_args = []
claude_args = []

[limits]
max_iterations = 30
max_failures = 3
max_stagnant = 4
task_seconds = 28800
iteration_wall_seconds = 3600
backoff_seconds = 10
# max_spend_usd requires USD-reporting worker AND Jira host. Codex subscriptions
# do not expose USD cost, so doctor rejects a hard-dollar cap with that host.

[jira]
host = "codex"
site = "https://coterieholdings.atlassian.net"
jql = 'project = QB AND assignee = "5aacdfe733719f2a5016620e" AND statusCategory != Done ORDER BY priority DESC, updated ASC'
eligible_statuses = ["In Progress", "Dev Ready"]
active_statuses = ["In Progress"]
priorities = ["Highest", "High", "Medium", "Low", "Lowest"]
poll_seconds = 300
max_tickets = 100

[repository]
path = "/Users/tawanc/Work/coterie-qb-prototype/coterie-qb"
github = "Jerawine/coterie-qb-prototype"
base = "origin/main"
pr_base = "main"
adapter = "coterie"
compose_files = ["docker-compose.yml"]
app_port = "app:3000"
services = ["db", "keycloak-db", "keycloak", "app", "typesense", "mailpit", "cloud-tasks-emulator", "audit-worker"]
jobs = ["migrate", "keycloak-provision", "app-access", "typesense-index"]
copy_ignored = []
cpus_per_service = 2
memory_per_service = "2g"
startup_seconds = 1800
readiness_seconds = 300
check_seconds = 900
playwright_package = "@playwright/test"
setup = [{ argv = ["npm", "ci"], cwd = "." }]
checks = [
  { argv = ["npm", "run", "lint"], cwd = "app" },
  { argv = ["npm", "run", "typecheck"], cwd = "app" },
  { argv = ["npm", "test", "--", "--run"], cwd = "app" },
  { argv = ["npm", "run", "build"], cwd = "app" },
]

[repository.check_env]
SKIP_RESEED_TESTS = "1"
APP_ENV = "local"
