# Project configuration. The host skill discovers real setup/check commands from
# your repository; replace these placeholders rather than copying another project.
project_name = "my-project"
concurrency = 1
min_free_gb = 5

[tasks]
provider = "local" # plain-language requests; no tracker required
poll_seconds = 30

[host]
codex_sandbox = "workspace-write"
claude_permission_mode = "acceptEdits"
iteration_seconds = 1800
stall_seconds = 600

[limits]
max_iterations = 30
max_failures = 3
max_stagnant = 4
task_seconds = 28800
iteration_wall_seconds = 3600
backoff_seconds = 10

[repository]
path = "/absolute/path/to/repository"
github = "OWNER/REPOSITORY"
base = "origin/main"
pr_base = "main"
compose_files = ["compose.yml"]
app_port = "app:3000"
services = ["app"]
checks = [{argv = ["YOUR_TEST_COMMAND"], cwd = "."}]
copy_ignored = []
cpus_per_service = 1
memory_per_service = "1g"
playwright_package = "/absolute/path/to/node_modules/@playwright/test"

# Optional phone-to-Mac trigger. Only these users can queue work.
[github_mentions]
enabled = false
allowed_users = ["YOUR_GITHUB_LOGIN"]
poll_seconds = 30

# Jira is optional. Set tasks.provider="jira" and configure [jira] explicitly.
# See config.coterie.example.toml for that project's complete adapter example.
